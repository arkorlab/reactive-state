# Fails when `.github/workflows/actions.lock` is out of step with the workflows, or a locked pin no
# longer verifies upstream. Every workflow here is onboarded, so a run uses the recorded commits.

name: Verify actions lockfile

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify actions lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify
