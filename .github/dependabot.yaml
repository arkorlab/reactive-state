version: 2
updates:
  # One entry, for the workspace root, because that is where the versions are: each dependency is
  # pinned once in `pnpm-workspace.yaml`'s catalog, and a `package.json` names `catalog:`.
  #
  # Version updates are off while the package's sources are still arriving in small pull requests:
  # each of them is checked against the versions the catalog pins now, and an update landing between
  # them would mix a second change into what each review reads. A limit of zero turns version updates
  # off and leaves security updates alone, which have a limit of their own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      # The day `minimumReleaseAge` already holds an install to.
      default-days: 1
    open-pull-requests-limit: 0

  # The workflows pin each action to its full commit SHA, with the tag in a trailing comment, and
  # `.github/workflows/actions.lock` records the same commits; an update here changes both in the
  # same pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    groups:
      # A week of pinned actions is one reading rather than five. A security update still arrives on
      # its own.
      actions:
        patterns:
          - '*'
